<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>

  <meta name="description" content="Mohamed Ashfak — Python Full Stack Developer, Backend Engineer & Gen AI Developer. Building AI-powered enterprise systems."/>
  <meta name="keywords" content="Mohamed Ashfak, Python Developer, Backend Engineer, Gen AI, Django, LangChain, AI Automation, Chennai"/>

  <meta property="og:title" content="Mohamed Ashfak | Gen AI Engineer & Backend Developer"/>
  <meta property="og:type" content="website"/>
  <meta name="theme-color" content="#080a07"/>
  <script>
    try {
      const savedTheme = localStorage.getItem("v4-theme");
      const theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.className = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#fafbf8" : "#090a09");
    } catch (_) {}
  </script>
  <title>Mohamed Ashfak · Gen AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23080a07'/><path d='M14 76V24l18 28 18-28v52M58 76l14-52 14 52M63 57h18' fill='none' stroke='%2386BC25' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;background:#090a09;color-scheme:dark}
    html.light{background:#fafbf8;color-scheme:light}
    body{
      background:inherit;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }
    #root{min-height:100vh}
  </style>
</head>
